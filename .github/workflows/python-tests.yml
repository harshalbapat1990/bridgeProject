name: Python tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -vv -m "not integration" --cov=infrastructure --cov=application --cov=domain --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov (optional)
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Test Summary
        if: always()
        run: |
          echo "::notice::Unit tests completed for Python ${{ matrix.python-version }}"
