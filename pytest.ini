[pytest]
markers =
    integration: Integration tests requiring external software (skip on CI)
    csi_bridge: Tests requiring CSI Bridge installation
    midas_civil: Tests requiring MIDAS Civil installation
    slow: Slow tests that take significant time
    unit: Unit tests with mocks (run on CI)

# Default options
addopts = -v

# Import root
pythonpath = src

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.14

